<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook Pro Real-Time Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1e3c72;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #2ecc71;
        }

        .status-dot.disconnected {
            background: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-change {
            font-size: 12px;
            margin-top: 8px;
            font-weight: 500;
        }

        .change-up {
            color: #e74c3c;
        }

        .change-down {
            color: #2ecc71;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
        }

        .card h2 {
            font-size: 16px;
            color: #2a5298;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8e8e8;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 15px;
        }

        .alert-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            color: #856404;
            font-size: 14px;
        }

        .alert-box.critical {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 13px;
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Real-Time MacBook Pro Dashboard</h1>
            <div class="status-indicator">
                <span class="status-dot disconnected" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent"></div>

        <!-- Footer -->
        <div class="footer">
            <span class="live-indicator"></span>Live Monitoring Active
        </div>
    </div>

    <script>
        let ws = null;
        let charts = {};
        let metricHistory = {
            timestamps: [],
            memory: [],
            cpu_percent: [],
            cpu_load: [],
            disk: [],
            battery: []
        };
        const MAX_HISTORY = 30;
        let previousMetrics = null;

        // Connect to WebSocket
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//localhost:8765`;
            
            console.log(`Connecting to WebSocket: ${wsUrl}`);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
                renderDashboard();
            };
            
            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus(false);
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus(false);
                // Try to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.classList.remove('disconnected');
                statusDot.classList.add('connected');
                statusText.textContent = 'Live - Connected';
                statusText.style.color = '#2ecc71';
            } else {
                statusDot.classList.remove('connected');
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Offline - Reconnecting...';
                statusText.style.color = '#e74c3c';
            }
        }

        function handleMessage(message) {
            if (message.type === 'metrics' || message.type === 'initial') {
                updateMetrics(message.data);
            }
        }

        function updateMetrics(metrics) {
            const timestamp = new Date(metrics.timestamp * 1000).toLocaleTimeString();
            
            // Add to history
            metricHistory.timestamps.push(timestamp);
            metricHistory.memory.push(metrics.memory);
            metricHistory.cpu_percent.push(metrics.cpu_percent);
            metricHistory.cpu_load.push(metrics.cpu_load);
            metricHistory.disk.push(metrics.disk);
            metricHistory.battery.push(metrics.battery);
            
            // Keep only recent history
            if (metricHistory.timestamps.length > MAX_HISTORY) {
                metricHistory.timestamps.shift();
                metricHistory.memory.shift();
                metricHistory.cpu_percent.shift();
                metricHistory.cpu_load.shift();
                metricHistory.disk.shift();
                metricHistory.battery.shift();
            }
            
            // Update display
            updateStats(metrics);
            updateCharts();
        }

        function updateStats(metrics) {
            const mainContent = document.getElementById('mainContent');
            
            let html = '<div class="stats-grid">';
            html += createStatBox('Memory', metrics.memory + '%', '#f5576c');
            html += createStatBox('Disk', metrics.disk + '%', '#4facfe');
            html += createStatBox('CPU %', metrics.cpu_percent.toFixed(1) + '%', '#ffa502');
            html += createStatBox('CPU Load', metrics.cpu_load.toFixed(2), '#43e97b');
            html += createStatBox('Battery', metrics.battery + '%', '#fa709a');
            html += '</div>';
            
            // Add alerts if needed
            if (metrics.memory > 80) {
                html += '<div class="alert-box critical">⚠️ High memory usage: ' + metrics.memory + '%</div>';
            }
            if (metrics.cpu_percent > 80) {
                html += '<div class="alert-box critical">⚠️ High CPU usage: ' + metrics.cpu_percent.toFixed(1) + '%</div>';
            }
            
            // Add charts
            html += '<div class="charts-grid">';
            html += '<div class="card"><h2>💾 Memory Usage</h2><div class="chart-container"><canvas id="memoryChart"></canvas></div></div>';
            html += '<div class="card"><h2>💿 Disk Usage</h2><div class="chart-container"><canvas id="diskChart"></canvas></div></div>';
            html += '<div class="card"><h2>📊 CPU Usage %</h2><div class="chart-container"><canvas id="cpuPercentChart"></canvas></div></div>';
            html += '<div class="card"><h2>⚙️ CPU Load</h2><div class="chart-container"><canvas id="cpuLoadChart"></canvas></div></div>';
            html += '<div class="card"><h2>🔋 Battery Level</h2><div class="chart-container"><canvas id="batteryChart"></canvas></div></div>';
            html += '</div>';
            
            mainContent.innerHTML = html;
        }

        function createStatBox(label, value, color) {
            return `
                <div class="stat-box">
                    <div class="stat-label">${label}</div>
                    <div class="stat-value" style="color: ${color};">${value}</div>
                </div>
            `;
        }

        function updateCharts() {
            const chartConfigs = [
                { id: 'memoryChart', label: 'Memory %', data: metricHistory.memory, color: '#f5576c' },
                { id: 'diskChart', label: 'Disk %', data: metricHistory.disk, color: '#4facfe' },
                { id: 'cpuPercentChart', label: 'CPU %', data: metricHistory.cpu_percent, color: '#ffa502' },
                { id: 'cpuLoadChart', label: 'CPU Load', data: metricHistory.cpu_load, color: '#43e97b' },
                { id: 'batteryChart', label: 'Battery %', data: metricHistory.battery, color: '#fa709a' }
            ];
            
            chartConfigs.forEach(config => {
                const canvas = document.getElementById(config.id);
                if (!canvas) return;
                
                if (charts[config.id]) {
                    // Update existing chart
                    charts[config.id].data.labels = metricHistory.timestamps;
                    charts[config.id].data.datasets[0].data = config.data;
                    charts[config.id].update('none'); // Update without animation
                } else {
                    // Create new chart
                    charts[config.id] = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: metricHistory.timestamps,
                            datasets: [{
                                label: config.label,
                                data: config.data,
                                borderColor: config.color,
                                backgroundColor: config.color + '15',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3,
                                pointBackgroundColor: config.color,
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 0 },
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            });
        }

        function renderDashboard() {
            updateStats({
                memory: 0,
                disk: 0,
                cpu_percent: 0,
                cpu_load: 0,
                battery: 0
            });
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
