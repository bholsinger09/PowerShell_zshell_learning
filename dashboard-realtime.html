<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook Pro Real-Time Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1e3c72;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #2ecc71;
        }

        .status-dot.disconnected {
            background: #e74c3c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-change {
            font-size: 12px;
            margin-top: 8px;
            font-weight: 500;
        }

        .change-up {
            color: #e74c3c;
        }

        .change-down {
            color: #2ecc71;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
        }

        .card h2 {
            font-size: 16px;
            color: #2a5298;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8e8e8;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 15px;
        }

        .processes-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        .processes-section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .processes-section table {
            width: 100%;
            background: white;
        }

        .processes-section th {
            background: #f5f7fa;
            color: #1e3c72;
            font-weight: 600;
            border-bottom: 2px solid #e0e6ed;
        }

        .processes-section td {
            border-bottom: 1px solid #e0e6ed;
        }

        .alert-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            color: #856404;
            font-size: 14px;
        }

        .alert-box.critical {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 13px;
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
        }
    </style>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Real-Time MacBook Pro Dashboard</h1>
            <div class="status-indicator">
                <span class="status-dot disconnected" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent"></div>

        <!-- Footer -->
        <div class="footer">
            <span class="live-indicator"></span>Live Monitoring Active
        </div>
    </div>

    <script>
        let ws = null;
        let charts = {};
        let metricHistory = {
            timestamps: [],
            memory: [],
            cpu_percent: [],
            cpu_load: [],
            disk: [],
            battery: [],
            network_down_mbps: [],
            network_up_mbps: [],
            network_total_mbps: []
        };
        let topProcesses = [];
        let activeConnections = [];
        let systemUptime = 0;
        let connectionCount = 0;
        const MAX_HISTORY = 30;
        let previousMetrics = null;
        let refreshInterval = null;
        const AUTO_REFRESH_INTERVAL = 2 * 60 * 1000; // 2 minutes in milliseconds

        // Async WebSocket connection
        async function connectWebSocket() {
            return new Promise((resolve) => {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//localhost:8765`;
                
                console.log(`🔌 Connecting to WebSocket: ${wsUrl}`);
                
                ws = new WebSocket(wsUrl);
                
                ws.onopen = async () => {
                    console.log('✅ WebSocket connected');
                    await updateStatus(true);
                    await renderDashboard();
                    resolve(true);
                };
                
                ws.onmessage = async (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        await handleMessage(message);
                    } catch (e) {
                        console.error('Error parsing message:', e);
                    }
                };
                
                ws.onerror = async (error) => {
                    console.error('❌ WebSocket error:', error);
                    await updateStatus(false);
                };
                
                ws.onclose = async () => {
                    console.log('🔌 WebSocket disconnected');
                    await updateStatus(false);
                    // Try to reconnect after 3 seconds
                    setTimeout(() => connectWebSocket(), 3000);
                };
            });
        }

        async function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            return new Promise((resolve) => {
                if (connected) {
                    statusDot.classList.remove('disconnected');
                    statusDot.classList.add('connected');
                    statusText.textContent = 'Live - Connected';
                    statusText.style.color = '#2ecc71';
                } else {
                    statusDot.classList.remove('connected');
                    statusDot.classList.add('disconnected');
                    statusText.textContent = 'Offline - Reconnecting...';
                    statusText.style.color = '#e74c3c';
                }
                resolve();
            });
        }

        async function handleMessage(message) {
            if (message.type === 'initial' || message.type === 'metrics' || message.type === 'update') {
                await updateMetrics(message.data);
            }
        }

        async function updateMetrics(metrics) {
            return new Promise((resolve) => {
                const timestamp = new Date(metrics.timestamp * 1000).toLocaleTimeString();
                
                // Add to history asynchronously
                metricHistory.timestamps.push(timestamp);
                metricHistory.memory.push(metrics.memory);
                metricHistory.cpu_percent.push(metrics.cpu_percent);
                metricHistory.cpu_load.push(metrics.cpu_load);
                metricHistory.disk.push(metrics.disk);
                metricHistory.battery.push(metrics.battery);
                metricHistory.network_down_mbps.push(metrics.network_down_mbps || 0);
                metricHistory.network_up_mbps.push(metrics.network_up_mbps || 0);
                metricHistory.network_total_mbps.push((metrics.network_total_mbps || 0));
                
                // Store connection and uptime data
                connectionCount = metrics.connection_count || 0;
                systemUptime = metrics.uptime_hours || 0;
                
                // Parse active connections
                if (metrics.network_connections) {
                    activeConnections = metrics.network_connections.split('|').slice(0, 10).map(c => {
                        const parts = c.split(':');
                        return {
                            host: parts[0] || 'N/A',
                            proto: parts[1] || 'N/A'
                        };
                    }).filter(c => c.host !== 'N/A');
                }
                
                // Store process data
                if (metrics.top_processes) {
                    topProcesses = metrics.top_processes.split('|').slice(0, 5).map(p => {
                        const parts = p.split(':');
                        return {
                            name: parts[0] || 'N/A',
                            cpu: parseFloat(parts[1]) || 0,
                            memory: parseFloat(parts[2]) || 0
                        };
                    });
                }
                
                // Keep only recent history
                if (metricHistory.timestamps.length > MAX_HISTORY) {
                    metricHistory.timestamps.shift();
                    metricHistory.memory.shift();
                    metricHistory.cpu_percent.shift();
                    metricHistory.cpu_load.shift();
                    metricHistory.disk.shift();
                    metricHistory.battery.shift();
                    metricHistory.network_down_mbps.shift();
                    metricHistory.network_up_mbps.shift();
                    metricHistory.network_total_mbps.shift();
                }
                
                // Update display
                updateStats(metrics);
                updateCharts();
                updateProcessTable();
                updateConnectionsTable();
                resolve();
            });
        }

        function updateStats(metrics) {
            // Only update the stat boxes, don't recreate canvas elements
            const statBoxes = document.querySelectorAll('.stat-value');
            if (statBoxes.length >= 9) {
                statBoxes[0].textContent = metrics.memory + '%';
                statBoxes[1].textContent = metrics.disk + '%';
                statBoxes[2].textContent = metrics.cpu_percent.toFixed(1) + '%';
                statBoxes[3].textContent = metrics.cpu_load.toFixed(2);
                statBoxes[4].textContent = metrics.battery + '%';
                statBoxes[5].textContent = (metrics.network_down_mbps || 0).toFixed(2) + ' Mbps';
                statBoxes[6].textContent = (metrics.network_up_mbps || 0).toFixed(2) + ' Mbps';
                statBoxes[7].textContent = (metrics.network_total_mbps || 0).toFixed(2) + ' Mbps';
                statBoxes[8].textContent = (metrics.connection_count || 0);
            }
            
            // Update alerts
            let alertHtml = '';
            if (metrics.memory > 80) {
                alertHtml += '<div class="alert-box critical">⚠️ High memory usage: ' + metrics.memory + '%</div>';
            }
            if (metrics.cpu_percent > 80) {
                alertHtml += '<div class="alert-box critical">⚠️ High CPU usage: ' + metrics.cpu_percent.toFixed(1) + '%</div>';
            }
            if ((metrics.network_total_mbps || 0) > 50) {
                alertHtml += '<div class="alert-box critical">⚠️ High network activity: ' + (metrics.network_total_mbps).toFixed(1) + ' Mbps</div>';
            }
            
            const alertsContainer = document.getElementById('alertsContainer');
            if (alertsContainer) {
                alertsContainer.innerHTML = alertHtml;
            }
        }

        function initializeDashboard(metrics) {
            // Initialize dashboard HTML structure (only called once)
            const mainContent = document.getElementById('mainContent');
            
            let html = '<div class="stats-grid">';
            html += createStatBox('Memory', metrics.memory + '%', '#f5576c');
            html += createStatBox('Disk', metrics.disk + '%', '#4facfe');
            html += createStatBox('CPU %', metrics.cpu_percent.toFixed(1) + '%', '#ffa502');
            html += createStatBox('CPU Load', metrics.cpu_load.toFixed(2), '#43e97b');
            html += createStatBox('Battery', metrics.battery + '%', '#fa709a');
            html += createStatBox('⬇️ Down', '0.00 Mbps', '#9b59b6');
            html += createStatBox('⬆️ Up', '0.00 Mbps', '#3498db');
            html += createStatBox('🌐 Total', '0.00 Mbps', '#1abc9c');
            html += createStatBox('🔌 Connections', '0', '#e74c3c');
            html += '</div>';
            
            html += '<div id="alertsContainer"></div>';
            
            // Add charts with canvas elements
            html += '<div class="charts-grid">';
            html += '<div class="card"><h2>💾 Memory Usage</h2><div class="chart-container"><canvas id="memoryChart"></canvas></div></div>';
            html += '<div class="card"><h2>💿 Disk Usage</h2><div class="chart-container"><canvas id="diskChart"></canvas></div></div>';
            html += '<div class="card"><h2>📊 CPU Usage %</h2><div class="chart-container"><canvas id="cpuPercentChart"></canvas></div></div>';
            html += '<div class="card"><h2>⚙️ CPU Load</h2><div class="chart-container"><canvas id="cpuLoadChart"></canvas></div></div>';
            html += '<div class="card"><h2>🔋 Battery Level</h2><div class="chart-container"><canvas id="batteryChart"></canvas></div></div>';
            html += '<div class="card"><h2>🌐 Network (Mbps)</h2><div class="chart-container"><canvas id="networkChart"></canvas></div></div>';
            html += '</div>';
            
            // Add processes table
            html += '<div class="processes-section"><h2>🔄 Top CPU Processes</h2><div id="processesContainer"></div></div>';
            
            // Add active connections section
            html += '<div class="processes-section"><h2>🌐 Active Connections (Top 10)</h2><div id="connectionsContainer"></div></div>';
            
            mainContent.innerHTML = html;
        }

        function createStatBox(label, value, color) {
            return `
                <div class="stat-box">
                    <div class="stat-label">${label}</div>
                    <div class="stat-value" style="color: ${color};">${value}</div>
                </div>
            `;
        }

        function updateCharts() {
            const chartConfigs = [
                { id: 'memoryChart', label: 'Memory %', data: metricHistory.memory, color: '#f5576c', max: 100 },
                { id: 'diskChart', label: 'Disk %', data: metricHistory.disk, color: '#4facfe', max: 100 },
                { id: 'cpuPercentChart', label: 'CPU %', data: metricHistory.cpu_percent, color: '#ffa502', max: 100 },
                { id: 'cpuLoadChart', label: 'CPU Load', data: metricHistory.cpu_load, color: '#43e97b', max: 10 },
                { id: 'batteryChart', label: 'Battery %', data: metricHistory.battery, color: '#fa709a', max: 100 }
            ];
            
            chartConfigs.forEach(config => {
                const canvas = document.getElementById(config.id);
                if (!canvas) return;
                
                if (charts[config.id]) {
                    // Update existing chart
                    charts[config.id].data.labels = metricHistory.timestamps;
                    charts[config.id].data.datasets[0].data = config.data;
                    charts[config.id].update('none'); // Update without animation
                } else {
                    // Create new chart
                    const yMax = config.max || Math.max(...config.data, 10);
                    charts[config.id] = new Chart(canvas, {
                        type: 'line',
                        data: {
                            labels: metricHistory.timestamps,
                            datasets: [{
                                label: config.label,
                                data: config.data,
                                borderColor: config.color,
                                backgroundColor: config.color + '15',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3,
                                pointBackgroundColor: config.color,
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 0 },
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: config.max || undefined,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            });
            
            // Update network chart with download + upload datasets
            const networkCanvas = document.getElementById('networkChart');
            if (networkCanvas) {
                if (charts.networkChart) {
                    charts.networkChart.data.labels = metricHistory.timestamps;
                    charts.networkChart.data.datasets[0].data = metricHistory.network_down_mbps;
                    charts.networkChart.data.datasets[1].data = metricHistory.network_up_mbps;
                    charts.networkChart.update('none');
                } else {
                    charts.networkChart = new Chart(networkCanvas, {
                        type: 'line',
                        data: {
                            labels: metricHistory.timestamps,
                            datasets: [
                                {
                                    label: 'Download (Mbps)',
                                    data: metricHistory.network_down_mbps,
                                    borderColor: '#3498db',
                                    backgroundColor: '#3498db15',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4,
                                    pointRadius: 3,
                                    pointBackgroundColor: '#3498db',
                                    pointBorderColor: '#fff',
                                    pointBorderWidth: 2
                                },
                                {
                                    label: 'Upload (Mbps)',
                                    data: metricHistory.network_up_mbps,
                                    borderColor: '#e74c3c',
                                    backgroundColor: '#e74c3c15',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4,
                                    pointRadius: 3,
                                    pointBackgroundColor: '#e74c3c',
                                    pointBorderColor: '#fff',
                                    pointBorderWidth: 2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 0 },
                            plugins: { legend: { display: true, position: 'bottom' } },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            }
        }

        function updateProcessTable() {
            const container = document.getElementById('processesContainer');
            if (!container || topProcesses.length === 0) return;
            
            let html = '<table style="width:100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden;">';
            html += '<tr style="background: #f5f7fa; border-bottom: 2px solid #e0e6ed;"><th style="padding: 12px; text-align: left;">Process</th><th style="padding: 12px; text-align: center;">CPU %</th><th style="padding: 12px; text-align: center;">Memory %</th></tr>';
            
            topProcesses.forEach((proc, idx) => {
                const bgColor = idx % 2 === 0 ? '#fff' : '#f9fafb';
                html += `<tr style="background: ${bgColor}; border-bottom: 1px solid #e0e6ed;">`;
                html += `<td style="padding: 12px; font-family: monospace; font-size: 12px;">${proc.name}</td>`;
                html += `<td style="padding: 12px; text-align: center; color: #f5576c; font-weight: 600;">${proc.cpu.toFixed(1)}%</td>`;
                html += `<td style="padding: 12px; text-align: center; color: #4facfe; font-weight: 600;">${proc.memory.toFixed(1)}%</td>`;
                html += '</tr>';
            });
            
            html += '</table>';
            container.innerHTML = html;
        }

        function updateConnectionsTable() {
            const container = document.getElementById('connectionsContainer');
            if (!container) return;
            
            if (activeConnections.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No active connections detected</p>';
                return;
            }
            
            let html = '<table style="width:100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden;">';
            html += '<tr style="background: #f5f7fa; border-bottom: 2px solid #e0e6ed;"><th style="padding: 12px; text-align: left;">Host/IP</th><th style="padding: 12px; text-align: center;">Protocol</th><th style="padding: 12px; text-align: center;">Status</th></tr>';
            
            activeConnections.forEach((conn, idx) => {
                const bgColor = idx % 2 === 0 ? '#fff' : '#f9fafb';
                const protoColor = conn.proto === 'TCP' ? '#3498db' : '#1abc9c';
                html += `<tr style="background: ${bgColor}; border-bottom: 1px solid #e0e6ed;">`;
                html += `<td style="padding: 12px; font-family: monospace; font-size: 12px;">${conn.host}</td>`;
                html += `<td style="padding: 12px; text-align: center; color: ${protoColor}; font-weight: 600;">${conn.proto}</td>`;
                html += `<td style="padding: 12px; text-align: center; color: #2ecc71; font-weight: 600;">🔗 Connected</td>`;
                html += '</tr>';
            });
            
            html += '</table>';
            html += `<p style="color: #999; font-size: 12px; padding: 12px 0; margin: 0;">Total active connections: ${connectionCount}</p>`;
            container.innerHTML = html;
        }

        async function renderDashboard() {
            initializeDashboard({
                memory: 0,
                disk: 0,
                cpu_percent: 0,
                cpu_load: 0,
                battery: 0
            });
        }

        // Initialize with auto-refresh
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Initial connection
                await connectWebSocket();
                
                // Set up auto-refresh every 2 minutes
                console.log('⏰ Setting auto-refresh every 2 minutes');
                refreshInterval = setInterval(async () => {
                    console.log('🔄 Auto-refreshing page...');
                    // Reload the page to get fresh connection and reset charts
                    location.reload();
                }, AUTO_REFRESH_INTERVAL);
                
                // Show refresh timer in console
                const refreshMinutes = AUTO_REFRESH_INTERVAL / 60000;
                console.log(`✅ Dashboard ready. Auto-refresh set to ${refreshMinutes} minutes.`);
            } catch (error) {
                console.error('Failed to initialize dashboard:', error);
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', async () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
